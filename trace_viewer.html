<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRACE — Incident Timeline Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', system-ui, sans-serif; }

  header {
    background: #161b22; border-bottom: 1px solid #30363d;
    padding: 16px 24px; display: flex; align-items: center; gap: 16px;
  }
  header h1 { font-size: 1.4rem; letter-spacing: 2px; color: #00c853; }
  header span { color: #8b949e; font-size: 0.85rem; }
  #meta { margin-left: auto; text-align: right; font-size: 0.8rem; color: #8b949e; }

  #drop-zone {
    margin: 40px auto; max-width: 600px; padding: 48px;
    border: 2px dashed #30363d; border-radius: 12px; text-align: center;
    cursor: pointer; transition: border-color 0.2s;
  }
  #drop-zone:hover, #drop-zone.drag-over { border-color: #00c853; }
  #drop-zone h2 { font-size: 1.1rem; color: #8b949e; margin-bottom: 8px; }
  #drop-zone p  { font-size: 0.85rem; color: #484f58; }
  #file-input   { display: none; }

  #controls {
    display: none; padding: 16px 24px; gap: 12px;
    align-items: center; background: #161b22; border-bottom: 1px solid #30363d;
  }
  #query-input {
    flex: 1; padding: 8px 14px; background: #0d1117; border: 1px solid #30363d;
    border-radius: 6px; color: #e6edf3; font-size: 0.9rem;
  }
  #query-input:focus { outline: none; border-color: #00c853; }
  .btn {
    padding: 8px 18px; border: none; border-radius: 6px;
    cursor: pointer; font-size: 0.85rem; font-weight: 600;
  }
  .btn-green  { background: #00c853; color: #000; }
  .btn-grey   { background: #21262d; color: #e6edf3; }
  .btn-green:hover { background: #00e676; }
  .btn-grey:hover  { background: #30363d; }

  #answer-box {
    display: none; margin: 0 24px 0; padding: 14px 18px;
    background: #161b22; border-left: 3px solid #00c853;
    color: #adbac7; font-family: monospace; font-size: 0.85rem;
    white-space: pre-wrap; border-radius: 0 6px 6px 0;
  }

  #filter-bar {
    display: none; padding: 8px 24px; gap: 8px; flex-wrap: wrap;
    background: #0d1117; border-bottom: 1px solid #30363d;
  }
  .filter-btn {
    padding: 4px 14px; border-radius: 20px; border: 1px solid #30363d;
    background: transparent; color: #8b949e; cursor: pointer; font-size: 0.78rem;
  }
  .filter-btn.active, .filter-btn:hover { border-color: #00c853; color: #00c853; }

  #section-label {
    padding: 10px 24px 4px; font-size: 0.7rem; letter-spacing: 2px;
    color: #484f58; text-transform: uppercase;
  }

  #event-list { padding: 0 24px 40px; display: flex; flex-direction: column; gap: 8px; }

  .event-card {
    display: flex; align-items: stretch; background: #161b22;
    border-radius: 8px; overflow: hidden; cursor: pointer;
    border: 1px solid #21262d; transition: border-color 0.15s;
  }
  .event-card:hover { border-color: #30363d; }

  .status-strip { width: 5px; flex-shrink: 0; }
  .strip-CONFIRMED   { background: #00c853; }
  .strip-UNCONFIRMED { background: #ffd600; }
  .strip-REJECTED    { background: #d50000; }

  .card-body { padding: 14px 16px; flex: 1; }
  .card-type  { font-size: 1rem; font-weight: 600; text-transform: capitalize; }
  .card-time  { font-size: 0.78rem; color: #8b949e; font-family: monospace; margin-top: 2px; }
  .card-src   { font-size: 0.75rem; color: #484f58; margin-top: 2px; }

  .status-badge {
    align-self: center; margin-right: 16px; padding: 4px 12px;
    border-radius: 4px; font-size: 0.75rem; font-weight: 700;
  }
  .badge-CONFIRMED   { background: #1b5e20; color: #fff; }
  .badge-UNCONFIRMED { background: #e65100; color: #fff; }
  .badge-REJECTED    { background: #b71c1c; color: #fff; }

  /* Detail modal */
  #modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.75); z-index: 100; justify-content: center; align-items: center;
  }
  #modal {
    background: #161b22; border: 1px solid #30363d; border-radius: 12px;
    width: 560px; max-width: 95vw; max-height: 90vh; overflow-y: auto; padding: 28px;
  }
  #modal h2 { font-size: 1.3rem; margin-bottom: 4px; text-transform: capitalize; }
  #modal .modal-status { font-size: 1rem; font-weight: 700; margin-bottom: 16px; }
  .detail-label { font-size: 0.7rem; color: #484f58; text-transform: uppercase; letter-spacing: 1px; margin-top: 14px; }
  .detail-value { font-size: 0.9rem; color: #e6edf3; margin-top: 2px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .bar-label { width: 60px; font-size: 0.8rem; color: #8b949e; }
  .bar-track { flex: 1; height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; }
  .bar-fill  { height: 100%; border-radius: 4px; transition: width 0.3s; }
  .fill-camera { background: #1565c0; }
  .fill-audio  { background: #6a1b9a; }
  .fill-motion { background: #e65100; }
  .hash-line { font-family: monospace; font-size: 0.72rem; color: #484f58; margin-top: 4px; word-break: break-all; }
  .close-btn { float: right; background: #21262d; border: none; color: #e6edf3;
    padding: 6px 14px; border-radius: 6px; cursor: pointer; margin-bottom: 8px; }

  #empty { display: none; text-align: center; padding: 80px; color: #484f58; }
</style>
</head>
<body>

<header>
  <h1>TRACE</h1>
  <span>Incident Timeline — Office Kit Viewer</span>
  <div id="meta"></div>
</header>

<div id="drop-zone" onclick="document.getElementById('file-input').click()"
     ondragover="event.preventDefault();this.classList.add('drag-over')"
     ondragleave="this.classList.remove('drag-over')"
     ondrop="handleDrop(event)">
  <input type="file" id="file-input" accept=".json" onchange="loadFile(this.files[0])">
  <h2>Drop events.json here  or  click to browse</h2>
  <p>Export from the TRACE app: Timeline → ⋮ menu → Export JSON (Office Kit)<br>
     Then transfer via USB or share to this laptop and open it here.</p>
</div>

<div id="controls" style="display:none; flex-direction:row;">
  <input id="query-input" type="text" placeholder='Ask: "what happened before the impact?" or "show confirmed events"'>
  <button class="btn btn-green" onclick="runQuery()">Ask</button>
  <button class="btn btn-grey" onclick="reloadAll()">Show All</button>
</div>

<div id="answer-box"></div>

<div id="filter-bar" style="display:none; flex-direction:row; align-items:center; gap:8px; padding:8px 24px;">
  <span style="font-size:0.75rem;color:#484f58;">Filter:</span>
  <button class="filter-btn active" onclick="filter('ALL',this)">All</button>
  <button class="filter-btn" onclick="filter('CONFIRMED',this)">CONFIRMED</button>
  <button class="filter-btn" onclick="filter('UNCONFIRMED',this)">UNCONFIRMED</button>
  <button class="filter-btn" onclick="filter('REJECTED',this)">REJECTED</button>
</div>

<div id="section-label" style="display:none;">INCIDENT TIMELINE</div>
<div id="empty">No events match the current filter.</div>
<div id="event-list"></div>

<div id="modal-overlay" onclick="if(event.target===this)closeModal()" style="display:none;">
  <div id="modal"><div id="modal-content"></div></div>
</div>

<script>
let ALL_EVENTS = [];
const fmtPct = v => v === 'null' ? 'No signal' : Math.round(parseFloat(v) * 100) + '%';
const fmtNum = v => v === 'null' ? 0 : Math.round(parseFloat(v) * 100);

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) loadFile(file);
}

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      ALL_EVENTS = data.events || [];
      document.getElementById('drop-zone').style.display = 'none';
      document.getElementById('controls').style.display = 'flex';
      document.getElementById('filter-bar').style.display = 'flex';
      document.getElementById('section-label').style.display = 'block';
      document.getElementById('meta').innerHTML =
        `Exported: ${data.exported_at}<br>Device: ${data.device}  |  ${data.event_count} events`;
      renderEvents(ALL_EVENTS.slice().reverse()); // newest first
    } catch(ex) { alert('Invalid JSON: ' + ex.message); }
  };
  reader.readAsText(file);
}

function renderEvents(events) {
  const list = document.getElementById('event-list');
  const empty = document.getElementById('empty');
  list.innerHTML = '';
  empty.style.display = events.length === 0 ? 'block' : 'none';

  events.forEach(e => {
    const card = document.createElement('div');
    card.className = 'event-card';
    card.innerHTML = `
      <div class="status-strip strip-${e.status}"></div>
      <div class="card-body">
        <div class="card-type">${e.type.replace(/_/g,' ')}</div>
        <div class="card-time">${e.timestamp_human}</div>
        <div class="card-src">Source: ${e.source} &nbsp;|&nbsp; Confidence: ${fmtPct(e.confidence)}</div>
      </div>
      <div class="status-badge badge-${e.status}">${e.status}</div>`;
    card.onclick = () => showDetail(e);
    list.appendChild(card);
  });
}

function filter(status, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('answer-box').style.display = 'none';
  const filtered = status === 'ALL' ? ALL_EVENTS : ALL_EVENTS.filter(e => e.status === status);
  renderEvents(filtered.slice().reverse());
}

function reloadAll() {
  document.getElementById('answer-box').style.display = 'none';
  document.getElementById('query-input').value = '';
  renderEvents(ALL_EVENTS.slice().reverse());
}

function runQuery() {
  const q = document.getElementById('query-input').value.toLowerCase().trim();
  if (!q || ALL_EVENTS.length === 0) return;

  const sorted = ALL_EVENTS.slice().sort((a,b) => a.timestamp - b.timestamp);
  let answer = '';

  if (q.includes('how many') || q.includes('count') || q.includes('total')) {
    const c = sorted.filter(e=>e.status==='CONFIRMED').length;
    const u = sorted.filter(e=>e.status==='UNCONFIRMED').length;
    const r = sorted.filter(e=>e.status==='REJECTED').length;
    answer = `Total: ${sorted.length}   CONFIRMED: ${c}   UNCONFIRMED: ${u}   REJECTED: ${r}`;
  } else if (q.includes('confirmed') && !q.includes('unconfirmed')) {
    const list = sorted.filter(e=>e.status==='CONFIRMED');
    answer = list.length ? list.map(describeEvent).join('\n') : 'No confirmed events.';
    renderEvents(list.reverse());
  } else if (q.includes('unconfirmed')) {
    const list = sorted.filter(e=>e.status==='UNCONFIRMED');
    answer = list.length ? list.map(describeEvent).join('\n') : 'No unconfirmed events.';
    renderEvents(list.reverse());
  } else if (q.includes('before')) {
    const target = findTarget(q, sorted);
    const list = sorted.filter(e => e.timestamp < target.timestamp);
    answer = `Before "${target.type}" @ ${target.timestamp_human}:\n` +
             (list.length ? list.map(describeEvent).join('\n') : '  Nothing recorded before this event.');
    renderEvents(list.reverse());
  } else if (q.includes('after')) {
    const target = findTarget(q, sorted);
    const list = sorted.filter(e => e.timestamp > target.timestamp);
    answer = `After "${target.type}" @ ${target.timestamp_human}:\n` +
             (list.length ? list.map(describeEvent).join('\n') : '  Nothing recorded after this event.');
    renderEvents(list.reverse());
  } else if (q.includes('last') || q.includes('recent')) {
    const last = sorted[sorted.length-1];
    answer = last ? `Most recent: ${describeEvent(last)}` : 'No events.';
  } else if (q.includes('fall') || q.includes('impact')) {
    const list = sorted.filter(e => e.type.includes('fall') || e.type.includes('impact'));
    answer = list.length ? list.map(describeEvent).join('\n') : 'No fall/impact events.';
    renderEvents(list.reverse());
  } else if (q.includes('alarm') || q.includes('audio') || q.includes('sound')) {
    const list = sorted.filter(e => e.source === 'audio');
    answer = list.length ? list.map(describeEvent).join('\n') : 'No audio events.';
    renderEvents(list.reverse());
  } else if (q.includes('motion') || q.includes('shake')) {
    const list = sorted.filter(e => e.source === 'motion');
    answer = list.length ? list.map(describeEvent).join('\n') : 'No motion events.';
    renderEvents(list.reverse());
  } else {
    answer = 'Try: "how many events?" / "before the impact" / "show confirmed" / "last event" / "show alarm events"';
  }

  const box = document.getElementById('answer-box');
  box.textContent = answer;
  box.style.display = 'block';
}

function findTarget(q, sorted) {
  const kws = ['object_falls','object_moves','impact','alarm','abnormal_sound','fall','alarm'];
  for (const kw of kws) {
    if (q.includes(kw.replace('_',' ')) || q.includes(kw)) {
      const match = sorted.filter(e => e.type.includes(kw) || e.source === kw);
      if (match.length) return match[match.length-1];
    }
  }
  return sorted[sorted.length-1];
}

function describeEvent(e) {
  return `  * ${e.type.replace(/_/g,' ')} @ ${e.timestamp_human}  [${e.status}]`;
}

function showDetail(e) {
  document.getElementById('modal-content').innerHTML = `
    <button class="close-btn" onclick="closeModal()">Close</button>
    <h2>${e.type.replace(/_/g,' ')}</h2>
    <div class="modal-status" style="color:${e.status==='CONFIRMED'?'#00c853':e.status==='UNCONFIRMED'?'#ffd600':'#d50000'}">${e.status}</div>

    <div class="detail-label">Timestamp</div>
    <div class="detail-value" style="font-family:monospace">${e.timestamp_human}</div>

    <div class="detail-label">Primary Source / Confidence</div>
    <div class="detail-value">${e.source}  —  ${fmtPct(e.confidence)}</div>

    <div class="detail-label">Sensor Evidence (fusion window)</div>
    <div class="bar-row">
      <span class="bar-label">Camera</span>
      <div class="bar-track"><div class="bar-fill fill-camera" style="width:${fmtNum(e.camera_confidence)}%"></div></div>
      <span style="font-size:0.8rem;color:#8b949e;width:42px;text-align:right">${fmtPct(e.camera_confidence)}</span>
    </div>
    <div class="bar-row">
      <span class="bar-label">Audio</span>
      <div class="bar-track"><div class="bar-fill fill-audio" style="width:${fmtNum(e.audio_confidence)}%"></div></div>
      <span style="font-size:0.8rem;color:#8b949e;width:42px;text-align:right">${fmtPct(e.audio_confidence)}</span>
    </div>
    <div class="bar-row">
      <span class="bar-label">Motion</span>
      <div class="bar-track"><div class="bar-fill fill-motion" style="width:${fmtNum(e.motion_confidence)}%"></div></div>
      <span style="font-size:0.8rem;color:#8b949e;width:42px;text-align:right">${fmtPct(e.motion_confidence)}</span>
    </div>

    <div class="detail-label">Tamper-Evidence (SHA-256)</div>
    <div class="hash-line">${e.hash}</div>
    <div class="hash-line" style="color:#30363d">prev: ${e.previous_hash}</div>
  `;
  document.getElementById('modal-overlay').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal-overlay').style.display = 'none';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.getElementById('query-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') runQuery();
});
</script>
</body>
</html>
